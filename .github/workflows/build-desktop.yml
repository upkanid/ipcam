name: Build Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: pnpm --filter desktop build

      - name: Package (electron-builder)
        run: pnpm --filter desktop dist --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SKIP_NOTARIZE: true

      - name: Ad-hoc codesign + repackage DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find apps/desktop/dist -maxdepth 2 -name "*.app" | head -1)
          echo "Signing: $APP"
          codesign --deep --force --sign - "$APP"
          DMG=$(find apps/desktop/dist -maxdepth 1 -name "*.dmg" | head -1)
          echo "Replacing: $DMG"
          rm -f "$DMG"
          hdiutil create \
            -volname "IPCam Upkan" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "$DMG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
