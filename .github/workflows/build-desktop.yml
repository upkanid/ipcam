name: Build Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.2.0). If empty, uses version from package.json'
        required: false
        default: ''

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix native binary permissions
        if: runner.os != 'Windows'
        run: |
          chmod +x node_modules/app-builder-bin/mac/app-builder_* 2>/dev/null || true
          chmod +x node_modules/app-builder-bin/linux/app-builder_* 2>/dev/null || true
          chmod +x node_modules/7zip-bin/mac/*/7za 2>/dev/null || true
          chmod +x node_modules/7zip-bin/linux/*/7za 2>/dev/null || true

      - name: Build Electron app
        run: npm run build:desktop

      - name: Run desktop tests
        run: npm run test -w apps/desktop

      - name: Package (electron-builder)
        run: npm run dist -w apps/desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SKIP_NOTARIZE: true

      - name: Ad-hoc codesign + repackage DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find apps/desktop/dist -maxdepth 2 -name "*.app" | head -1)
          echo "Signing: $APP"
          codesign --deep --force --sign - "$APP"
          DMG=$(find apps/desktop/dist -maxdepth 1 -name "*.dmg" | head -1)
          echo "Replacing: $DMG"
          rm -f "$DMG"
          hdiutil create \
            -volname "IPCam Upkan" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "$DMG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          retention-days: 7
          path: |
            apps/desktop/dist/*Setup*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version and tag
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
